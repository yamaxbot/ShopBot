[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "car-parking-playerok-bot"
version = "0.1.0"
description = "Последовательная выдача аккаунтов Car Parking Multiplayer 2 через премиум-лот Playerok"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram[proxy]==3.31.0",
  "cryptography==50.0.2",
  "certifi==2026.7.22",
  "python-dotenv==1.1.1",
  "tqdm==4.67.1",
  "requests==2.32.3",
  "beautifulsoup4==4.15.0",
  "playerokapi @ git+https://github.com/alleexxeeyy/PlayerokAPI.git@58a077d2cc2045f39b84de1092f7caa0950b74fd",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
playerok-bot = "playerok_bot.cli:main"
playerok-telegram = "playerok_bot.telegram.bot:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
